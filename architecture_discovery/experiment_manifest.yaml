  task_adapter: fixed_addition_v1
  task_adapter_hash: 0663e4cc7a57a98661e7317331f708b69d1d2ac213be335b91098e47e0a06880
  seed_derivation: sha256-v1
  device: cuda
  dtype: float32
  max_optimizer_steps: 30000

          vendor/openevolve/openevolve/llm/openai.py: c01228a2a47b7d22096206e9f9da999dfb031fed728568583da6fbc667fec1d1
          vendor_patches/openevolve_provider_attempt_ledger.patch: b0f731fa87fda394188dadc8fdab9c687b22c0a635eebef06d04cc4740017dc6
      isolate_provider_key_from_process_pool_payload:

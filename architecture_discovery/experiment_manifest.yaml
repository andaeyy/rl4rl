          vendor/openevolve/openevolve/process_parallel.py: d740466efc43d6f70f341bcf6d33701188edf215e2347f66febaa7d45ad10971
          vendor/openevolve/tests/test_process_parallel.py: 65f7402c8caec92254eec677bccd709569e221dc43f4e81f48648e98137b3afe
          vendor_patches/openevolve_process_isolation.patch: f39fa2a2ed50b7d22a28a5c5ce5547838f66b8445b2f17ad24f899a4e92560a8

shared_generation:
  target_model: gpt-5.6-sol
  model_env: DISCOVERY_MODEL

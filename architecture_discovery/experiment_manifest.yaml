schema_name: architecture_discovery_experiment_manifest
schema_version: "3"

study:
  name: valid_architecture_discovery_on_adderboard
  objective: valid architecture-family and mechanism discovery
  parameter_count_role: descriptive_metadata_only
  protocol: ../RIGOROUS_EXPERIMENT_PLAN_V2.md
  implementation_contract: IMPLEMENTATION_CONTRACT.md
  scientific_decisions: scientific_decisions.yaml
  readiness_evidence: readiness_evidence.yaml
  launch_status: blocked
  pilot_ready: false
  pilot_validated: false
  main_study_ready: false
  independent_unit: complete_assigned_run
  primary_outcome: unique_layer_b_qualified_mechanism_clusters_per_run

primary_causal_design:
  engine: study.engine.CommonStudyEngine
  instrumented_engine: artifacts.study_sink.ArtifactEmittingStudyEngine
  factors:
    parent_policy: [single, portfolio]
    proposal_policy: [ordinary, scheduled_transition]
  conditions:
    C0: {parent_policy: single, proposal_policy: ordinary}
    C1: {parent_policy: single, proposal_policy: scheduled_transition}
    C2: {parent_policy: portfolio, proposal_policy: ordinary}
    C3: {parent_policy: portfolio, proposal_policy: scheduled_transition}
  native_greedy_and_openevolve_role: secondary_system_replications
  portfolio_size_k: null
  transition_schedule: null
  primary_budget: null
  provider_attempt_limit_per_opportunity: null
  provider_attempt_limit_status: unresolved_scientific_budget_decision
  provider_attempt_accounting_status: typed_budget_accounting_integrated_live_transport_ledger_pending_scientific_launch_surface
  repair_limit_per_opportunity: null

secondary_controls:
  no_search:
    status: provider_adapter_implemented_not_scheduled_scientifically
    model: gpt-5.6-sol
    adaptive_feedback: false
    matched_generator_budget_required: true
  prompt_placebo:
    status: separate_optional_control
    adaptive_feedback: true

machine:
  execution_backend: modal
  requested_gpu: NVIDIA T4
  observed_gpu: null
  preferred_device: cuda
  scientific_fallback_device: none
  engineering_test_device: cpu_with_explicit_flag_only
  historical_local_host:
    model: MacBook Air Mac17,3
    chip: Apple M5
    memory_gb: 24
    os: macOS 26.5.1
    preferred_device: mps

runtime:
  python: "3.12"
  environment: /opt/architecture_discovery/.venv
  package_manager: uv
  setup_selected_device: cuda
  setup_device_reason: canonical_modal_cuda_execution_condition
  pytorch_enable_mps_fallback: false
  cublas_workspace_config: ":4096:8"

remote_execution:
  provider: modal
  profile: scalingintelligence
  environment: main
  app_name: rl4rl-architecture-discovery
  app_module: modal_app.py
  mode: ephemeral_modal_run
  current_scope: engineering_validation_only
  full_profile_action: not_exposed_pending_scientific_approval
  future_full_profile_requires_separate_resource_contract: true
  deployed_app: false
  detached_calls: false
  python: "3.12"
  modal_version: 1.5.3
  initial_gpu: T4
  function_cpu_request_cores: 2.0
  function_cpu_soft_limit_cores: 2.0
  function_cpu_limit_kind: soft_throttle_threshold
  function_memory_request_mib: 8192
  function_memory_limit_mib: 8192
  function_memory_limit_kind: hard
  function_platform_compute_cost_ceiling_enforced: false
  runtime_functions_preemptible: true
  platform_preemption_restart_possible: true
  logical_call_count_is_not_container_attempt_ceiling: true
  function_region: null
  image_build_cpu_request_cores: 2.0
  image_build_cpu_soft_limit_cores: null
  image_build_memory_request_mib: 8192
  image_build_memory_limit_mib: null
  image_build_region: null
  image_build_subprocess_thread_limit: 2
  image_build_resource_limits_exposed: false
  image_build_platform_compute_cost_ceiling_enforced: false
  modal_price_basis_schema: ModalPriceBasis/1.0
  modal_price_basis_max_age_hours: 48
  modal_cost_gate_scope: local_pre_popen_request_rate_and_one_gib_month_storage_estimate_not_platform_billing_cap
  max_containers: 1
  min_containers: 0
  retries: 0
  function_timeout_seconds: 300
  controller_subprocess_timeout_seconds: 240
  provider_request_timeout_seconds: 180
  provider_attempt_finalization_reserve_seconds: 60
  parallel_candidate_training: false
  provider_canaries_sequential: true
  engineering_canary_maximum_provider_attempts_per_harness: 1
  four_harness_engineering_canary_maximum_provider_attempts: 4
  provider_attempt_ledger_schema: ProviderAttemptRecord/1.0
  provider_canary_approval_plan_schema: ProviderCanaryApprovalPlan/1.2
  provider_canary_aggregate_outcome_schema: ProviderCanaryAggregateOutcomeReceipt/1.1
  provider_canary_selector_schema: ModalProviderCanaryRunSelector/2.0
  modal_local_host_anchor_schema: ModalLocalHostAnchor/1.0
  modal_remote_run_reservation_schema: ModalRemoteRunReservation/1.2
  modal_action_intent_schema: ModalActionIntent/1.6
  modal_local_process_start_schema: ModalLocalProcessStart/1.1
  modal_action_attempt_receipt_schema: ModalActionAttemptReceipt/3.6
  modal_action_recovery_request_schema: ModalActionRecoveryRequest/1.0
  modal_action_recovery_intent_schema: ModalActionRecoveryIntent/1.0
  modal_action_recovery_host_containment_schema: ModalActionRecoveryHostContainment/1.0
  modal_action_recovery_resolution_schema: ModalActionRecoveryResolution/1.0
  modal_cleanup_snapshot_capture_manifest_schema: ModalCleanupSnapshotCaptureManifest/1.0
  modal_migration_lineage_schema: ModalMigrationLineage/1.1
  modal_prior_cohort_quarantine_accounting_schema: ModalPriorCohortQuarantineAccounting/1.1
  modal_migration_cohort_roster_schema: ModalMigrationCohortRoster/4.0
  modal_action_lock_path: outputs/readiness/.modal_action.lock
  modal_action_lock_scope: launcher_recovery_snapshot_capture_prior_accounting_lineage_roster_resource_cleanup_migration_bundle_and_global_journal_scan
  modal_global_action_journal_scanner_implemented: true
  modal_global_action_journal_prelaunch_gate_wired: true
  modal_action_orphan_recovery_status: operational_exact_v1_cli_scanner_validated
  failed_provider_canary_retention: sanitized_provider_attempt_ledger_only
  artifact_volume: rl4rl-architecture-artifacts
  artifact_mount: /mnt/discovery
  provider_secret: rl4rl-discovery-provider
  image_source_manifest_schema: ModalImageSourceManifest/1.0
  image_source_sha256: null
  live_validation_status: pending_explicit_cost_approval

modal_engineering_evidence:
  live_evidence_authority: external_create_only_receipts
  receipt_contracts:
    modal_cuda_environment_validated:
      receipt_path_template: outputs/readiness/modal_only_final/modal_live_cohorts/{source_tree_sha256}/{image_source_sha256}/{cohort_id}/components/modal_cuda_environment_validation_receipt.v2.0.json
      receipt_contract:
        schema_name: ModalCUDAEnvironmentValidationReceipt
        schema_version: "2.0"
    modal_artifact_round_trip_validated:
      receipt_path_template: outputs/readiness/modal_only_final/modal_live_cohorts/{source_tree_sha256}/{image_source_sha256}/{cohort_id}/components/modal_artifact_round_trip_validation_receipt.v3.0.json
      receipt_contract:
        schema_name: ModalArtifactRoundTripValidationReceipt
        schema_version: "3.0"
    modal_resource_cleanup_validated:
      receipt_path_template: outputs/readiness/modal_only_final/modal_live_cohorts/{source_tree_sha256}/{image_source_sha256}/{cohort_id}/components/modal_resource_cleanup_validation_receipt.v4.0.json
      receipt_contract:
        schema_name: ModalResourceCleanupValidationReceipt
        schema_version: "4.0"
    modal_migration_validation_bundle_validated:
      receipt_path_template: outputs/readiness/modal_only_final/modal_live_cohorts/{source_tree_sha256}/{image_source_sha256}/{cohort_id}/components/modal_migration_validation_bundle_receipt.v4.0.json
      receipt_contract:
        schema_name: ModalMigrationValidationBundleReceipt
        schema_version: "4.0"
  remote_execution_image_source_sha256_null_reason: experiment_manifest_is_source_bound_and_embedding_its_derived_image_digest_would_create_a_self_reference_and_invalidate_the_live_cohort

sources:
  adderboard:
    url: https://github.com/anadim/AdderBoard.git
    commit: 07061de8d833d04e9800a009721731586e102aef
  starting_model:
    url: https://github.com/anadim/smallest-addition-transformer-claude-code.git
    commit: 85f7fb10277111df9ff746f1448eef243cbb51d5
    role: conventional_validated_starting_architecture
  openevolve:
    url: https://github.com/andaeyy/openevolve.git
    commit: 258c29b56fbff42da26bdf64cb42ba5b142e2903
    upstream_url: https://github.com/algorithmicsuperintelligence/openevolve.git
    upstream_commit: 411fb59c886c18704caaffb611e17cf9e7d824d2
    patches:
      provider_transport_single_shot_and_attempt_ledger:
